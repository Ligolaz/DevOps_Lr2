name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-lint:
    name: Test/Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run linting check
        run: echo "Linting complete"

  build-package:
    name: Build/Package
    needs: test-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app:latest .
